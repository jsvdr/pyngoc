<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyngo - Compilador</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <section class="panel">
        <div class="panel-header">
          <h2>PROGRAMA:</h2>

          <label for="fileInput" class="file-button"> Cargar Archivo </label>

          <input type="file" id="fileInput" accept=".txt,.pyn" hidden />
        </div>

        <textarea id="codigo" spellcheck="false">
{
    int contador = 1;
    int limite = 10;
    bool activo = true;

    for contador < limite {
        if contador > 5 {
            print(contador & 2);
        } else {
            print(contador);
        };
        contador = contador @ 1;
    };
}</textarea
        >
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>TOKENS:</h2>

          <button id="btnTokens" class="action-button">Tokens</button>
        </div>

        <textarea
          id="tokens"
          readonly
          spellcheck="false"
          placeholder="Los tokens aparecerán aquí..."
        ></textarea>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>ERRORES:</h2>
        </div>

        <div class="parser-buttons">
          <button id="btnParser" class="action-button">Parser</button>

          <button id="btnLimpiar" class="clear-button">Limpiar</button>
        </div>

        <div id="parserResultado" class="parser-result"></div>

        <textarea
          id="errores"
          readonly
          spellcheck="false"
          placeholder="Los errores aparecerán aquí..."
        ></textarea>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
