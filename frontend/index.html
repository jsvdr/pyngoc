<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pyngo - Compilador</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <!-- PROGRAMA -->
    <section class="panel programa-panel">

      <div class="panel-header">

        <h2>PROGRAMA:</h2>

        <label for="fileInput" class="file-button">
          Cargar Archivo
        </label>

        <input type="file" id="fileInput" accept=".txt,.pyn" hidden />

      </div>

      <textarea id="codigo" spellcheck="false">{
    int a = 1;
    int b = 2;
    int c = a @ b;
    print ( c );
}</textarea>

    </section>


    <!-- TOKENS -->
    <section class="panel tokens-panel">

      <button id="btnTokens" class="main-button">
        TOKENS
      </button>

      <textarea id="tokens" readonly spellcheck="false" placeholder="Los tokens aparecerán aquí..."></textarea>

    </section>


    <!-- PARSER Y SEMÁNTICO -->
    <section class="panel errores-panel">

      <div class="analysis-buttons">

        <button id="btnParser" class="analysis-button">
          Parser
        </button>

        <button id="btnSemantico" class="analysis-button">
          Semántico
        </button>

      </div>

      <textarea id="errores" readonly spellcheck="false" placeholder="Resultado del análisis..."></textarea>

    </section>


    <!-- CÓDIGO INTERMEDIO -->
    <section class="panel ci-panel">

      <button id="btnCI" class="main-button">
        CI
      </button>

      <div class="tabla-ci-contenedor">

        <table class="tabla-ci">

          <thead>
            <tr>
              <th>NOMBRE</th>
              <th>OPERADOR</th>
              <th>ATRIBUTO</th>
            </tr>
          </thead>

          <tbody id="cuerpoIntermedio"></tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- BOTÓN FLOTANTE DE CÓDIGO OBJETO -->
  <button id="btnCO" class="co-button" title="Generar código objeto">
    CO
  </button>


  <!-- PANEL CÓDIGO OBJETO -->
  <section id="panelCO" class="co-panel" hidden>

    <div class="co-panel-header">

      <h2>Código Objeto</h2>

      <button id="btnCerrarCO" class="co-close" title="Cerrar">
        ×
      </button>

    </div>

    <div id="errorCO" class="co-error"></div>

    <div class="co-cuerpo">

      <!-- DATOS -->
      <section class="co-seccion">

        <h3>DATOS</h3>

        <table class="tabla-co">

          <thead>
            <tr>
              <th>DIR</th>
              <th>CONTENIDO</th>
              <th>HEX</th>
            </tr>
          </thead>

          <tbody id="cuerpoDatosCO"></tbody>

        </table>

      </section>


      <!-- CÓDIGO -->
      <section class="co-seccion">

        <h3>CÓDIGO</h3>

        <table class="tabla-co">

          <thead>
            <tr>
              <th>DIR</th>
              <th>CONTENIDO</th>
              <th>HEX</th>
            </tr>
          </thead>

          <tbody id="cuerpoCodigoCO"></tbody>

        </table>

      </section>

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
