[project]
name = "pyngo"
version = "1.2.0"
description = "A small multi-phase compiler for a typed teaching language"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "PLR1714"]
ignore = ["ERA001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
