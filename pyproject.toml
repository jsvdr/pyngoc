[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyngo"
version = "1.3.0"
description = "A small multi-phase compiler for a typed teaching language"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "jsvdr" }]
keywords = ["compiler", "lexer", "parser", "code-generation", "x86", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Compilers",
]
dependencies = [
  "flask>=3.1,<4",
  "gunicorn>=27.0.1,<28",
]

[project.scripts]
pyngo = "pyngo.cli:main"

[project.urls]
Homepage = "https://github.com/jsvdr/pyngoc"
Repository = "https://github.com/jsvdr/pyngoc"
Issues = "https://github.com/jsvdr/pyngoc/issues"
Changelog = "https://github.com/jsvdr/pyngoc/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pre-commit>=4",
  "pyright>=1.1.414",
  "pytest>=9.1",
  "ruff>=0.17",
]
# Only installed with `uv sync --group fuzz`: atheris ships Linux x86-64 wheels.
fuzz = [
  "atheris>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyngo"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "pyngo/web"

[tool.hatch.build.targets.sdist]
include = ["src/pyngo", "web", "tests", "docs", "README.md", "README.es.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "PLR1714"]
ignore = ["ERA001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = true
